name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Test
        run: python -m pytest

      - name: Validate configuration
        run: python -m daedalus validate --root .

  installers:
    name: Installer on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Run install.sh
        if: runner.os != 'Windows'
        shell: bash
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/daedalus-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/daedalus-bin
        run: |
          bash install.sh --source . --no-global --skip-opencode --no-shell --yes
          "$UV_TOOL_BIN_DIR/daedalus" --version
          "$UV_TOOL_BIN_DIR/daedalus" validate --root .
          "$UV_TOOL_BIN_DIR/daedalus" install --global --dir "$RUNNER_TEMP/opencode"
          "$UV_TOOL_BIN_DIR/daedalus" validate --root "$RUNNER_TEMP/opencode" --global

      - name: Run install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/daedalus-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/daedalus-bin
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 -Source . -NoGlobal -SkipOpencode -NoShell -Yes
          $daedalus = Join-Path $env:UV_TOOL_BIN_DIR "daedalus.exe"
          & $daedalus --version
          & $daedalus validate --root .
          & $daedalus install --global --dir (Join-Path $env:RUNNER_TEMP "opencode")
          & $daedalus validate --root (Join-Path $env:RUNNER_TEMP "opencode") --global
